server {
    listen 80;
    # Le dossier où se trouve ton build React (souvent /var/www/html/dist)
    root /var/www/html;
    index index.html;

    location / {
        # Essaye de servir le fichier, sinon redirige vers index.html
        # C'est CRUCIAL pour que le routage React (React Router) fonctionne
        try_files $uri $uri/ /index.html;
    }

    # Optimisation : Cache pour les fichiers statiques (JS, CSS, images)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Sécurité
    location ~ /\.ht {
        deny all;
    }
}