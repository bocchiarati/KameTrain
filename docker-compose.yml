services:
  # FRONTEND (React)
  app:
    image: node:latest
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes:
      - ./app:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"

  # BACKEND (Node.js API)
  api:
    image: node:latest
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api:/api
    working_dir: /api
    command: sh -c "npm install && npm run dev"
    environment:
      - DB_HOST=${DB_HOST:-database}
      - DB_USER=${DB_USER_NAME}
      - DB_PASSWORD=${DB_USER_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
    depends_on:
      - database

  # NGINX (Proxy pour lier les deux)
  server:
    image: nginx:alpine
    ports:
      - "${SERVER_PORT:-8883}:80"
    volumes:
      - ./app/dist:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - api

  database:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-database}
      MYSQL_USER: ${DB_USER_NAME:-user}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-password}
    volumes:
      - ./db-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-3306}:3306"

  adminer:
      image: adminer
      restart: always
      ports:
        - "${ADMINER_PORT:-80}:8080"
      depends_on:
        - database